name: CI

# رستا — دروازهٔ کیفیت: typecheck + lint + تست واحد + تست یکپارچه‌سازی + E2E مرورگر
# تست‌ها روی دیتابیس SQLite آزمایشی ایزوله اجرا می‌شوند (tests/.tmp) — هرگز دیتابیس واقعی لمس نمی‌شود.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  quality:
    name: typecheck + lint + unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Unit tests
        run: bun run test:unit

  integration:
    name: integration (API روی سرور واقعی + DB آزمایشی)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Integration tests (spawn خودکار سرور + دیتابیس تست)
        run: bun run test:integration

  e2e:
    name: e2e (مرورگر Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium

      - name: E2E tests
        run: bun run test:e2e

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  build:
    name: production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prisma generate
        run: bunx prisma generate

      - name: Build (standalone)
        run: bun run build
        env:
          DATABASE_URL: "file:/tmp/ci-build.db"
